spring.application.name=ACMIS

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api/v1

spring.datasource.url=${DB_URL:jdbc:h2:mem:tims;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=${FLYWAY_ENABLED:false}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

app.security.jwt-secret=${JWT_SECRET:change-this-development-secret-to-a-256-bit-value}
app.security.access-token-ttl=${ACCESS_TOKEN_TTL:PT15M}
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc.api-docs.path=/openapi
springdoc.swagger-ui.path=/swagger-ui.html
